<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Memo">
  <!-- 파비콘·탭 아이콘용. tools/make-icons.py가 그리는 PNG와 같은 도형·같은 색이고,
       좌표는 그쪽 1024 기준을 2로 나눈 값이다. 한쪽만 고치면 어긋나므로 함께 고칠 것.

       16~32px에서는 줄 2개가 거의 사라지지만, 카드 3장이 겹친 실루엣은 남는다.
       그래서 줄보다 카드의 단 차이(겹침 위치)를 우선해서 잡았다. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6E5BD0"/>
      <stop offset="1" stop-color="#B85E94"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- 뒤로 갈수록 작고 투명한 카드 — 쌓인 노트 -->
  <rect x="150" y="120" width="228" height="150" rx="26" fill="#FFFFFF" opacity="0.32"/>
  <rect x="132" y="168" width="248" height="160" rx="28" fill="#FFFFFF" opacity="0.55"/>
  <rect x="114" y="222" width="284" height="172" rx="30" fill="#FFFCF6"/>

  <!-- 앞 카드의 글줄 -->
  <g stroke="#B85E94" stroke-width="22" stroke-linecap="round">
    <line x1="152" y1="286" x2="330" y2="286"/>
    <line x1="152" y1="344" x2="252" y2="344"/>
  </g>
</svg>
